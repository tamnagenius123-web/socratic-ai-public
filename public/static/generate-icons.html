<!DOCTYPE html><html><body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function draw(canvasId, size) {
  const c = document.getElementById(canvasId);
  const ctx = c.getContext('2d');
  const s = size;
  // Background gradient
  const g = ctx.createLinearGradient(0, 0, s, s);
  g.addColorStop(0, '#5B4CDB');
  g.addColorStop(1, '#3B2FA8');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.roundRect(0, 0, s, s, s * 0.2);
  ctx.fill();
  // Brain icon
  ctx.fillStyle = 'white';
  ctx.font = `bold ${s * 0.45}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('S', s/2, s/2);
  // Small accent
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath();
  ctx.arc(s*0.75, s*0.25, s*0.12, 0, Math.PI*2);
  ctx.fill();
}
draw('c192', 192);
draw('c512', 512);
</script>
</body></html>
